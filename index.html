/* ②③ ショート（左右2分割） */

.banner-short { flex: 1; aspect-ratio: 1 / 1; }

.banner-row.empty { display: none; }

<script>
/* ============================================================
   PRバナー スプレッドシート連動スクリプト
   - URLの ?c=企業ID で該当企業のバナー構成を表示
   - 例: ?c=301  /  担当者切替も併用するなら ?s=sano&c=301
   ============================================================ */

/* ▼▼▼ 設定：ここだけ最初に1回書き換える ▼▼▼ */
// Googleスプレッドシートを「ウェブに公開(CSV)」したURL
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQaHerhMaT2JSH95gurH3PavrXUrjUHKFnPZBjIR5Zwyjqaa_VgK2PoVAzLr1y38qS895ZLmNpR6EUd/pub?gid=0&single=true&output=csv";
// 画像を置くフォルダ（GitHubリポジトリ内）
const IMAGE_BASE = "";
/* ▲▲▲ 設定ここまで ▲▲▲ */

// CSVの列名（スプレッドシート1行目のヘッダーと一致させる）
const COL = {
  id: "ID",
  company: "企業名",
  staff: "担当者",
  tel: "TEL",
  mail: "メール",
  img1: "①画像", link1: "①リンク",
  img2: "②画像", link2: "②リンク",
  img3: "③画像", link3: "③リンク",
  img4: "④画像", link4: "④リンク",
};

// 簡易CSVパーサ（カンマ・改行・ダブルクォート対応）
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { /* skip */ }
      else field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// CSV → オブジェクト配列
function csvToObjects(rows) {
  if (!rows.length) return [];
  const header = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const o = {};
    header.forEach((h, i) => o[h] = (r[i] || "").trim());
    return o;
  });
}

// 画像URLを解決（http始まりは外部、それ以外はbannersフォルダ）
function resolveImg(val) {
  if (!val) return "";
  if (/^https?:\/\//i.test(val)) return val;
  return IMAGE_BASE + val;
}

// 1スロットに画像とリンクをセット
function setSlot(slotId, imgVal, linkVal, altText) {
  const el = document.getElementById(slotId);
  if (!el) return;
  el.classList.remove("loading");
  const img = resolveImg(imgVal);
  if (!img) { el.classList.add("empty"); return; }
  el.classList.remove("empty");
  el.innerHTML = '<img src="' + img + '" alt="' + (altText || "") + '">';
  if (linkVal) { el.href = linkVal; }
  else { el.removeAttribute("href"); el.style.cursor = "default"; }
}

// 担当者情報を更新
function setStaff(rec) {
  if (rec[COL.staff]) {
    document.getElementById("staffName").textContent = "■営業担当：" + rec[COL.staff];
  }
  if (rec[COL.tel]) {
    document.getElementById("staffTel").textContent = "TEL：" + rec[COL.tel];
    if (window.__setStaffTel) window.__setStaffTel(rec[COL.tel]);
  }
  if (rec[COL.mail]) {
    document.getElementById("staffMail").textContent = "✉：" + rec[COL.mail];
    if (window.__setStaffMail) window.__setStaffMail(rec[COL.mail]);
  }
}

// メイン処理
async function loadBanners() {
  const params = new URLSearchParams(location.search);
  const cid = params.get("c");

  // 設定未完了 or IDなしの場合は何もしない（既定の見た目を保持）
  if (SHEET_CSV_URL.indexOf("★") !== -1) {
    console.warn("SHEET_CSV_URL が未設定です。");
    clearLoading();
    return;
  }

  try {
    const res = await fetch(SHEET_CSV_URL);
    const text = await res.text();
    const records = csvToObjects(parseCSV(text));

    // 企業IDで該当行を検索（なければ先頭行）
    let rec = null;
    if (cid) rec = records.find(r => r[COL.id] === cid);
    if (!rec) rec = records[0];
    if (!rec) { clearLoading(); return; }

    // バナー4スロット反映
    setSlot("slot1", rec[COL.img1], rec[COL.link1], rec[COL.company] + " バナー1");
    setSlot("slot2", rec[COL.img2], rec[COL.link2], rec[COL.company] + " バナー2");
    setSlot("slot3", rec[COL.img3], rec[COL.link3], rec[COL.company] + " バナー3");
    setSlot("slot4", rec[COL.img4], rec[COL.link4], rec[COL.company] + " バナー4");

    // ②③が両方空なら行ごと隠す
    const s2 = resolveImg(rec[COL.img2]), s3 = resolveImg(rec[COL.img3]);
    if (!s2 && !s3) document.getElementById("row23").classList.add("empty");

    // 担当者情報反映
    setStaff(rec);

  } catch (e) {
    console.error("バナー読み込み失敗:", e);
    clearLoading();
  }
}

function clearLoading() {
  ["slot1","slot2","slot3","slot4"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove("loading");
  });
}

document.addEventListener("DOMContentLoaded", loadBanners);
</script>

}
function sendMailAndClose(type, dialogId) {
    closeDialog(dialogId);
    sendMail(type);
}
['callDialog','baDialog','surveyDialog'].forEach(function(id) {
    document.getElementById(id).addEventListener('click', function(e) {
        if (e.target === this) closeDialog(id);
    });
});
</script>
